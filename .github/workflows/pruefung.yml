name: Prüfung

on:
  push:
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    env:
      # Nur Platzhalter: Die Prüfung soll zeigen, dass die App baut – echte Werte und Secrets gehören nicht hierher.
      NEXT_PUBLIC_SUPABASE_URL: https://platzhalter.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_platzhalter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
